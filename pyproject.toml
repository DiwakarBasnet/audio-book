[project]
name = "audio-book"
version = "0.1.0"
description = "Resumable ebook-to-audiobook pipeline with local Piper or Modal TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
tts = ["piper-tts>=1.3,<2"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "piper-tts>=1.3,<2"]
modal = ["modal>=1.0,<2"]

[dependency-groups]
dev = ["fastapi>=0.115,<1", "httpx>=0.28,<1"]

[project.scripts]
audiobook = "audio_book.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_book"]
